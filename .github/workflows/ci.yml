name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖（锁定 lockfile）
        run: npm ci --no-audit --no-fund

      - name: 后端语法检查（src 全量，新增文件自动纳入）
        run: for f in apps/api/src/*.js; do node --check "$f"; done

      - name: 后端集成测试
        run: npm test -w @vireo/api

      - name: 前端构建
        run: npm run build -w @vireo/web

      - name: 前端单元测试（markdown 渲染 / SSE 解析）
        run: npm test -w @vireo/web

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 构建 API 镜像（不推送）
        run: docker build -f apps/api/Dockerfile -t vireo-api:ci .
      - name: 构建 Web 镜像（不推送）
        run: docker build -f apps/web/Dockerfile -t vireo-web:ci .
