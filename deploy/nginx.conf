# 限流区域（写在 http 上下文，conf.d 会被 include 进 http 块）
limit_req_zone $binary_remote_addr zone=vireo_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vireo_auth:10m rate=1r/s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 上传体积上限需大于后端 multer 的 5MB×8，留出 multipart 边界余量
  client_max_body_size 45m;

  # 全局安全响应头
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # 基础 CSP：脚本仅同源，禁止 base 劫持与框架嵌入。
  # style 允许 unsafe-inline（SPA 内联样式常见）；后续可按需收紧。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1k;

  # 带 hash 的静态资源长缓存（location 内有 add_header，需重加安全头，否则不继承）
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  # SPA 前端路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 认证接口单独更严限流（防爆破），与后端 ratelimit 形成双层
  location /api/auth/ {
    limit_req zone=vireo_auth burst=10 nodelay;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API 反向代理（前后端分离 → 同源部署）
  location /api/ {
    limit_req zone=vireo_api burst=40 nodelay;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE 流式必需：关闭缓冲，拉长超时
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
  }

  # 注：原 /uploads/ 裸静态代理已移除。知识库原文件改由后端
  # GET /api/files/:id/download 鉴权下发，避免他人文档被直接访问与同源 XSS。

  # 健康检查透传（供外部探活）
  location = /api/health {
    proxy_pass http://api:8080;
    access_log off;
  }
}

